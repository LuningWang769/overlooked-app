name: Add daily issue

on:
  schedule:
    - cron: "0 13 * * *"   # 1:00pm UTC daily — edit to whatever time you like
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab too

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-issue.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "overlooked-bot"
          git config user.email "actions@github.com"
          git add issues.json
          git diff --cached --quiet || git commit -m "Add daily issue $(date -u +%Y-%m-%d)"
          git push
